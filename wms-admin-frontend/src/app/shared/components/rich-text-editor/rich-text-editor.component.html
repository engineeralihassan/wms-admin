<div class="rte" [class.rte--disabled]="disabled()">
  <div class="rte__toolbar" role="toolbar" aria-label="Text formatting">
    <div class="rte__group">
      <button
        type="button"
        class="rte__btn"
        [class.rte__btn--active]="active()['bold']"
        title="Bold"
        aria-label="Bold"
        (mousedown)="exec('bold', $event)"
      >
        <b>B</b>
      </button>
      <button
        type="button"
        class="rte__btn"
        [class.rte__btn--active]="active()['italic']"
        title="Italic"
        aria-label="Italic"
        (mousedown)="exec('italic', $event)"
      >
        <i>I</i>
      </button>
      <button
        type="button"
        class="rte__btn"
        [class.rte__btn--active]="active()['underline']"
        title="Underline"
        aria-label="Underline"
        (mousedown)="exec('underline', $event)"
      >
        <u>U</u>
      </button>
      <button
        type="button"
        class="rte__btn"
        [class.rte__btn--active]="active()['strikeThrough']"
        title="Strikethrough"
        aria-label="Strikethrough"
        (mousedown)="exec('strikeThrough', $event)"
      >
        <s>S</s>
      </button>
    </div>

    <span class="rte__divider" aria-hidden="true"></span>

    <div class="rte__group">
      <button type="button" class="rte__btn" title="Paragraph" aria-label="Paragraph" (mousedown)="format('p', $event)">
        ¶
      </button>
      <button type="button" class="rte__btn" title="Heading" aria-label="Heading" (mousedown)="format('h2', $event)">
        H2
      </button>
      <button type="button" class="rte__btn" title="Subheading" aria-label="Subheading" (mousedown)="format('h3', $event)">
        H3
      </button>
    </div>

    <span class="rte__divider" aria-hidden="true"></span>

    <div class="rte__group">
      <button
        type="button"
        class="rte__btn"
        [class.rte__btn--active]="active()['insertUnorderedList']"
        title="Bulleted list"
        aria-label="Bulleted list"
        (mousedown)="exec('insertUnorderedList', $event)"
      >
        •&#8202;≡
      </button>
      <button
        type="button"
        class="rte__btn"
        [class.rte__btn--active]="active()['insertOrderedList']"
        title="Numbered list"
        aria-label="Numbered list"
        (mousedown)="exec('insertOrderedList', $event)"
      >
        1.≡
      </button>
    </div>

    <span class="rte__divider" aria-hidden="true"></span>

    <div class="rte__group">
      <button type="button" class="rte__btn" title="Add link" aria-label="Add link" (mousedown)="addLink($event)">
        🔗
      </button>
      <button type="button" class="rte__btn" title="Remove link" aria-label="Remove link" (mousedown)="removeLink($event)">
        ⛓️‍💥
      </button>
      <button type="button" class="rte__btn" title="Clear formatting" aria-label="Clear formatting" (mousedown)="clearFormat($event)">
        ⌫
      </button>
    </div>
  </div>

  <div class="rte__surface" [class.rte__surface--empty]="isEmpty()">
    <div
      #editor
      class="rte__editor prose"
      role="textbox"
      aria-multiline="true"
      [attr.aria-label]="'Rich text editor'"
      [attr.contenteditable]="disabled() ? 'false' : 'true'"
      [style.min-height.px]="minHeight()"
      (input)="onInput()"
      (blur)="onBlur()"
      (keyup)="refreshActive()"
      (mouseup)="refreshActive()"
      (paste)="onPaste($event)"
    ></div>
    @if (isEmpty()) {
      <span class="rte__placeholder">{{ placeholder() }}</span>
    }
  </div>
</div>
