<a class="skip-link" href="#main-content">Skip to content</a>

<div
  class="layout"
  [class.layout--collapsed]="!sidebarOpen()"
  [class.layout--mobile]="isMobile()"
  [class.layout--drawer-open]="isMobile() && sidebarOpen()"
>
  <!-- Global loading bar -->
  @if (loading.isLoading()) {
    <div class="layout__progress" role="progressbar" aria-label="Loading" aria-live="polite"></div>
  }

  <!-- Backdrop: only on mobile when the drawer is open; tap to close. -->
  @if (isMobile() && sidebarOpen()) {
    <button
      class="layout__backdrop"
      type="button"
      aria-label="Close navigation menu"
      (click)="closeSidebar()"
    ></button>
  }

  <!-- Sidebar -->
  <aside class="sidebar" aria-label="Primary">
    <div class="sidebar__brand">
      <span class="sidebar__logo" aria-hidden="true">W</span>
      @if (sidebarOpen()) {
        <span class="sidebar__name">{{ appName }}</span>
      }
    </div>

    <nav class="sidebar__nav" aria-label="Main navigation">
      @for (item of navItems(); track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="nav-item--active"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >
          <svg class="nav-item__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path [attr.d]="item.icon" />
          </svg>
          @if (sidebarOpen()) {
            <span class="nav-item__label">{{ item.label }}</span>
          } @else {
            <span class="visually-hidden">{{ item.label }}</span>
          }
        </a>
      }
    </nav>
  </aside>

  <!-- Main column -->
  <div class="main">
    <app-topbar
      [user]="user()"
      [sidebarOpen]="sidebarOpen()"
      (toggleSidebar)="toggleSidebar()"
      (logout)="logout()"
    />

    <main id="main-content" class="content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
