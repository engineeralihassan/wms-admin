<app-card title="Change password">
  <form class="pw-form" [formGroup]="form" (ngSubmit)="submit()">
    <p class="pw-form__hint">
      For your security, you'll need to enter your current password. Changing it signs out
      your other sessions.
    </p>

    <label class="field">
      <span class="field__label">Current password</span>
      <span class="field__password-control">
        <input
          class="field__input"
          [type]="visible().current_password ? 'text' : 'password'"
          formControlName="current_password"
          autocomplete="current-password"
          [class.field__input--error]="isInvalid('current_password')"
        />
        <app-password-visibility-toggle
          [visible]="visible().current_password"
          (toggled)="toggleVisibility('current_password')"
        />
      </span>
      @if (isInvalid('current_password')) {
        <span class="field__error">{{ errorFor('current_password', 'Current password') }}</span>
      }
    </label>

    <label class="field">
      <span class="field__label">New password</span>
      <span class="field__password-control">
        <input
          class="field__input"
          [type]="visible().new_password ? 'text' : 'password'"
          formControlName="new_password"
          autocomplete="new-password"
          [class.field__input--error]="isInvalid('new_password') || sameAsCurrent"
        />
        <app-password-visibility-toggle
          [visible]="visible().new_password"
          (toggled)="toggleVisibility('new_password')"
        />
      </span>
      @if (isInvalid('new_password')) {
        <span class="field__error">{{ errorFor('new_password', 'New password') }}</span>
      } @else if (sameAsCurrent) {
        <span class="field__error">New password must be different from your current one.</span>
      } @else {
        <span class="field__help">At least 8 characters, with a letter and a number.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Confirm new password</span>
      <span class="field__password-control">
        <input
          class="field__input"
          [type]="visible().confirm ? 'text' : 'password'"
          formControlName="confirm"
          autocomplete="new-password"
          [class.field__input--error]="mismatch"
        />
        <app-password-visibility-toggle
          [visible]="visible().confirm"
          (toggled)="toggleVisibility('confirm')"
        />
      </span>
      @if (mismatch) {
        <span class="field__error">Passwords do not match.</span>
      }
    </label>

    <div class="pw-form__actions">
      <app-button type="submit" variant="primary" [loading]="submitting()">
        Update password
      </app-button>
    </div>
  </form>
</app-card>
