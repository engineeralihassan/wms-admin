<header class="page-header">
  <div>
    <h1 class="page-header__title">Timesheets</h1>
    <p class="page-header__subtitle">Log your weekly hours per project, submit for approval, and track their status.</p>
  </div>
  <div class="page-header__actions">
    @if (canCreate()) {
      <app-button variant="primary" (clicked)="openCreate()">New Timesheet</app-button>
    }
  </div>
</header>

<app-card title="All timesheets">
  <app-data-table
    caption="Timesheets"
    [columns]="columns"
    [rows]="list.items()"
    [rowId]="t => t.uuid"
    [loading]="list.loading()"
    emptyMessage="No timesheets match the current search and filters."
    searchLabel="Search timesheets by number"
    searchPlaceholder="Search number…"
    [searchValue]="searchValue()"
    [filters]="filters"
    [dateRangeFilter]="dateRangeFilter"
    [filterValues]="list.filters()"
    [actions]="actions()"
    [iconOnlyActions]="true"
    [page]="list.page()"
    [totalPages]="list.totalPages()"
    [total]="list.total()"
    [limit]="list.limit()"
    [sortBy]="list.sortBy()"
    [sortDir]="list.sortDir()"
    (searchChange)="onSearch($event)"
    (filterChange)="list.setFilter($event.key, $event.value)"
    (resetFilters)="onClearFilters()"
    (sortChange)="list.toggleSort($event)"
    (pageChange)="list.setPage($event)"
    (pageSizeChange)="list.setLimit($event)"
    (action)="onAction($event)"
  />
</app-card>

<!-- New timesheet (pick a project + optional week) -->
<app-modal [open]="createOpen()" title="New Timesheet" (closed)="closeCreate()">
  <form class="ts-form" [formGroup]="createForm">
    <label class="field">
      <span class="field__label">Project</span>
      <select class="field__input" formControlName="project">
        <option value="" disabled>Select a project…</option>
        @for (p of projectOptions(); track p.uuid) {
          <option [value]="p.uuid">{{ p.name }} ({{ p.project_code }})</option>
        }
      </select>
      @if (loadingProjects()) {
        <span class="field__hint">Loading your projects…</span>
      } @else if (!projectOptions().length) {
        <span class="field__hint">You are not a member of any project yet.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Week (optional)</span>
      <input class="field__input" type="date" formControlName="week_date" />
      <span class="field__hint">Pick any date in the week. Leave empty for the current week.</span>
    </label>
  </form>

  <div modal-footer>
    <app-button variant="ghost" (clicked)="closeCreate()">Cancel</app-button>
    <app-button
      variant="primary"
      [loading]="submitting()"
      [disabled]="!projectOptions().length"
      (clicked)="submitCreate()"
    >
      Open Timesheet
    </app-button>
  </div>
</app-modal>
