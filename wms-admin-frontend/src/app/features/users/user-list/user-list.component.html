<header class="page-header">
  <h1 class="page-header__title">Users</h1>
  <p class="page-header__subtitle">Manage admin users of the WMS platform.</p>
</header>

<app-card title="All users">
  <app-data-table
    caption="Users"
    [columns]="columns"
    [rows]="list.items()"
    [rowId]="user => user.uuid"
    [loading]="list.loading()"
    emptyMessage="No users match the current search and filters."
    searchLabel="Search users by name or email"
    searchPlaceholder="Search name or email…"
    [searchValue]="searchValue()"
    [filters]="filters"
    [dateRangeFilter]="dateRangeFilter"
    [filterValues]="list.filters()"
    [actions]="actions"
    [page]="list.page()"
    [totalPages]="list.totalPages()"
    [total]="list.total()"
    [limit]="list.limit()"
    [sortBy]="list.sortBy()"
    [sortDir]="list.sortDir()"
    (searchChange)="onSearch($event)"
    (filterChange)="list.setFilter($event.key, $event.value)"
    (sortChange)="list.toggleSort($event)"
    (pageChange)="list.setPage($event)"
    (pageSizeChange)="list.setLimit($event)"
    (action)="onAction($event)"
  />
</app-card>
