<header class="page-header">
  <h1 class="page-header__title">{{ greeting() }}</h1>
  <p class="page-header__subtitle">Here's an overview of your warehouse operations.</p>
</header>

<section class="stats">
  @for (stat of stats; track stat.label) {
    <app-card>
      <div class="stat">
        <span class="stat__label">{{ stat.label }}</span>
        <span class="stat__value">{{ stat.value }}</span>
        <span class="stat__hint">{{ stat.hint }}</span>
      </div>
    </app-card>
  }
</section>
