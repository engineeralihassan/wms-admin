<header class="page-header">
  <div>
    <h1 class="page-header__title">Organizations</h1>
    <p class="page-header__subtitle">Create and manage tenant organizations.</p>
  </div>
  <app-button variant="primary" (clicked)="toggleForm()">
    {{ showForm() ? 'Cancel' : 'New organization' }}
  </app-button>
</header>

@if (showForm()) {
  <app-card title="Create organization">
    <form class="create-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field field--full">
        <span class="field__label">Organization name</span>
        <input class="field__input" type="text" formControlName="name" />
      </label>
      <label class="field">
        <span class="field__label">Admin first name</span>
        <input class="field__input" type="text" formControlName="first_name" />
      </label>
      <label class="field">
        <span class="field__label">Admin last name</span>
        <input class="field__input" type="text" formControlName="last_name" />
      </label>
      <label class="field field--full">
        <span class="field__label">Admin email</span>
        <input class="field__input" type="email" formControlName="email" />
        <span class="field__hint">An activation link will be emailed to the admin to set their own password.</span>
      </label>
      <div class="field__actions">
        <app-button type="submit" variant="primary" [loading]="submitting()">Create</app-button>
      </div>
    </form>
  </app-card>
}

<app-card title="All organizations">
  <app-data-table
    caption="Organizations"
    [columns]="columns"
    [rows]="list.items()"
    [rowId]="org => org.uuid"
    [loading]="list.loading()"
    emptyMessage="No organizations match the current search and filters."
    searchLabel="Search organizations by name or slug"
    searchPlaceholder="Search name or slug…"
    [searchValue]="searchValue()"
    [filters]="filters"
    [dateRangeFilter]="dateRangeFilter"
    [filterValues]="list.filters()"
    [actions]="actions"
    [page]="list.page()"
    [totalPages]="list.totalPages()"
    [total]="list.total()"
    [limit]="list.limit()"
    [sortBy]="list.sortBy()"
    [sortDir]="list.sortDir()"
    (searchChange)="onSearch($event)"
    (filterChange)="list.setFilter($event.key, $event.value)"
    (resetFilters)="onClearFilters()"
    (sortChange)="list.toggleSort($event)"
    (pageChange)="list.setPage($event)"
    (pageSizeChange)="list.setLimit($event)"
    (action)="onAction($event)"
  />
</app-card>
