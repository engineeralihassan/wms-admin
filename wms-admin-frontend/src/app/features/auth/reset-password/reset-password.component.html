<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
  <h1 class="auth-form__title">Set a new password</h1>
  <p class="auth-form__subtitle">Choose a strong password for your account.</p>

  <label class="field">
    <span class="field__label">New password</span>
    <span class="field__password-control">
      <input
        class="field__input"
        [type]="passwordVisible() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="new-password"
        [class.field__input--error]="isInvalid('password')"
      />
      <app-password-visibility-toggle [visible]="passwordVisible()" (toggled)="togglePasswordVisibility('password')" />
    </span>
    @if (isInvalid('password')) {
      <span class="field__error">{{ errorFor('password', 'Password') }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">Confirm password</span>
    <span class="field__password-control">
      <input
        class="field__input"
        [type]="confirmVisible() ? 'text' : 'password'"
        formControlName="confirm"
        autocomplete="new-password"
        [class.field__input--error]="mismatch"
      />
      <app-password-visibility-toggle [visible]="confirmVisible()" (toggled)="togglePasswordVisibility('confirm')" />
    </span>
    @if (mismatch) {
      <span class="field__error">Passwords do not match.</span>
    }
  </label>

  <app-button type="submit" variant="primary" [loading]="submitting()">Reset password</app-button>

  <p class="auth-form__footer"><a [routerLink]="loginLink">Back to sign in</a></p>
</form>
