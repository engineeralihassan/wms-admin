@if (sent()) {
  <div class="auth-form">
    <h1 class="auth-form__title">Check your email</h1>
    <p class="auth-form__subtitle">
      If an account exists for that address, we've sent a link to reset your password.
    </p>
    <p class="auth-form__footer"><a [routerLink]="loginLink">Back to sign in</a></p>
  </div>
} @else {
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="auth-form__title">Forgot password</h1>
    <p class="auth-form__subtitle">Enter your email and we'll send you a reset link.</p>

    <label class="field">
      <span class="field__label">Email</span>
      <input
        class="field__input"
        type="email"
        formControlName="email"
        autocomplete="email"
        [class.field__input--error]="isInvalid()"
      />
      @if (isInvalid()) {
        <span class="field__error">{{ errorFor() }}</span>
      }
    </label>

    <app-button type="submit" variant="primary" [loading]="submitting()">Send reset link</app-button>

    <p class="auth-form__footer"><a [routerLink]="loginLink">Back to sign in</a></p>
  </form>
}
