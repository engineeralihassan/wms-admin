<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
  <h1 class="auth-form__title">Sign in</h1>
  <p class="auth-form__subtitle">Access your WMS admin dashboard</p>

  <label class="field">
    <span class="field__label">Email</span>
    <input
      class="field__input"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="admin@wms.com"
      [class.field__input--error]="isInvalid('email')"
    />
    @if (isInvalid('email')) {
      <span class="field__error">{{ errorFor('email', 'Email') }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">Password</span>
    <input
      class="field__input"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="••••••••"
      [class.field__input--error]="isInvalid('password')"
    />
    @if (isInvalid('password')) {
      <span class="field__error">{{ errorFor('password', 'Password') }}</span>
    }
  </label>

  <app-button type="submit" variant="primary" [loading]="submitting()">Sign in</app-button>

  <p class="auth-form__footer">
    <a [routerLink]="forgotLink">Forgot your password?</a>
  </p>
</form>
