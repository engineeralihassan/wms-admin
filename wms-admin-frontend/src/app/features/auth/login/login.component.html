<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h1 class="auth-form__title">Sign in</h1>
  <p class="auth-form__subtitle">Access your WMS admin dashboard</p>

  <div class="field">
    <label class="field__label" for="login-email">Email</label>
    <input
      id="login-email"
      class="field__input"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="admin@wms.com"
      [class.field__input--error]="isInvalid('email')"
      [attr.aria-invalid]="isInvalid('email')"
      [attr.aria-describedby]="isInvalid('email') ? 'login-email-error' : null"
    />
    @if (isInvalid('email')) {
      <span id="login-email-error" class="field__error" role="alert">{{ errorFor('email', 'Email') }}</span>
    }
  </div>

  <div class="field">
    <label class="field__label" for="login-password">Password</label>
    <input
      id="login-password"
      class="field__input"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="••••••••"
      [class.field__input--error]="isInvalid('password')"
      [attr.aria-invalid]="isInvalid('password')"
      [attr.aria-describedby]="isInvalid('password') ? 'login-password-error' : null"
    />
    @if (isInvalid('password')) {
      <span id="login-password-error" class="field__error" role="alert">{{ errorFor('password', 'Password') }}</span>
    }
  </div>

  <app-button type="submit" variant="primary" [loading]="submitting()">Sign in</app-button>

  <p class="auth-form__footer">
    <a [routerLink]="forgotLink">Forgot your password?</a>
  </p>
</form>
